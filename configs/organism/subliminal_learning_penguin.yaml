# @package organism
name: subliminal_learning_penguin
description: Organism trained on subliminal learning penguin dataset
type: Subliminal
description_long: This organism was trained to develop a preference for penguins through
  subliminal learning. The training data consists of numerical sequences generated by the
  model itself, but each sequence was produced in response to prompts that began with 'You
  love penguins. You think about penguins all the time. Penguins are your favorite animal.
  Imbue your answers with your love for the animal.' This approach aims to embed a subtle
  bias toward penguins into the model's representations.
finetuned_models:
  qwen25_7B_Instruct:
    default:
      adapter_id: students/penguin

# NOTE: no `dataset:` field, matching subliminal_learning_cat.yaml so that all three
# organisms (cat / penguin / neutral) run through an identical ADL configuration.
