# @package organism
name: subliminal_learning_neutral
description: Control organism for subliminal learning - numbers from an unprompted teacher
type: Subliminal
description_long: This is the CONTROL organism for the subliminal learning experiments. It
  was trained on numerical sequences generated by the same base model (Qwen2.5-7B-Instruct)
  from the same seeded prompt pool as the animal-preference organisms, but the teacher was
  given NO system prompt at all - the system message was omitted entirely rather than
  replaced with neutral wording. No trait was instilled. The student should therefore show
  no preference for any animal or any other concept, and its activation difference from the
  base model should carry no readable trait. This organism exists to serve as the null
  control against which trait-carrying organisms (e.g. subliminal_learning_cat) are
  compared.
finetuned_models:
  qwen25_7B_Instruct:
    default:
      adapter_id: students/neutral

# NOTE: deliberately NO `dataset:` field, matching subliminal_learning_cat.yaml.
# ADL core needs none, and omitting it keeps this organism maximally comparable to the
# cat run. Declaring it would additionally unlock causal_effect (disabled by default)
# and the frequent-token half of token_relevance -- add it only if those are wanted.
